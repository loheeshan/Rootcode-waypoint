[project]
name = "waypoint-api"
version = "0.1.0"
description = "Waypoint modular FastAPI backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "ortools>=9.12,<10",
  "argon2-cffi>=25.1,<26",
  "pyjwt>=2.10.1,<3",
  "email-validator>=2.3,<3",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
